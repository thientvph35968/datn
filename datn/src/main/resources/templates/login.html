<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập</title>
  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --accent:#3b82f6;
      --muted:#6b7280;
      --radius:12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg),#eef4ff);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 8px 30px rgba(18,38,63,0.08);
      padding:32px;
      text-align:center;
    }

    /* logo ảnh */
    .logo-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      box-shadow: 0 0 10px rgba(59,130,246,0.3);
    }

    h1{
      margin:8px 0 6px;
      font-size:22px;
    }
    p.sub{
      margin:0 0 20px;
      color:var(--muted);
      font-size:14px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:12px;
      text-align:left;
    }
    label{
      font-size:13px;
      color:var(--muted);
    }
    input[type="text"], input[type="password"]{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid #e6e9ef;
      background:#fbfdff;
      outline:none;
      font-size:14px;
      transition:all .2s;
    }
    input:focus{
      box-shadow:0 0 0 4px rgba(59,130,246,0.08);
      border-color:rgba(59,130,246,0.6);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .checkbox{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .btn{
      padding:12px 14px;
      border-radius:10px;
      border:0;
      background:var(--accent);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
      width:100%;
      margin-top:10px;
      transition:background .2s, transform .1s;
    }
    .btn:hover{
      background:#2563eb;
    }
    .btn:active{
      transform:translateY(1px);
    }

    .meta{
      font-size:13px;
      color:var(--muted);
      text-align:center;
      margin-top:14px;
    }

    .small-link{
      font-size:13px;
      color:var(--accent);
      text-decoration:none;
    }
    .small-link:hover{
      text-decoration:underline;
    }

    .error{
      color:#b91c1c;
      font-size:13px;
      display:none;
      text-align:center;
      margin-top:8px;
    }

    @media (max-width:480px){
      .card{padding:20px}
      .logo-img{width:80px;height:80px;}
    }
  </style>
</head>
<body>
<main class="card" role="main">
  <!-- Logo ảnh nằm trên cùng -->
  <img src="PL.jpg" alt="Logo" class="logo-img">

  <h1>Đăng nhập</h1>
  <p class="sub">Chào mừng trở lại 👋</p>

  <form id="loginForm" th:action="@{/do-login}" method="post"> <div th:if="${param.error}" class="error" style="display:block; color: red; margin-bottom: 10px;">
    Tài khoản hoặc mật khẩu không chính xác, hoặc tài khoản đã bị vô hiệu hóa.
  </div>
    <div th:if="${param.logout}" class="error" style="display:block; color: green; margin-bottom: 10px;">
      Bạn đã đăng xuất thành công.
    </div>

    <div>
      <label for="email">Tài khoản</label>
      <input id="email" name="username" type="text" placeholder="Nhập tài khoản" required>
    </div>

    <div>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required>
    </div>

    <button class="btn" type="submit">Đăng nhập</button>
  </form>
  <p class="meta">Chưa có tài khoản? <a href="/dangki" class="small-link">Đăng ký</a></p>
</main>


</body>
</html>
